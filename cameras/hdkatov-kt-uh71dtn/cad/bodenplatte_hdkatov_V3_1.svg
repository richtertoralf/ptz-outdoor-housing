<g font-size="20">
<text x="660" y="150">Bodenverlängerung gemäß Issue #11</text>
<text x="660" y="207">* Hinten nur Auflage unter der Schale;</text>
<text x="660" y="236">in den Rundungen folgt der Steg der Wand.</text>
<text x="660" y="300">Kabel vor dem Aufsetzen des Oberteils</text>
<text x="660" y="329">anschließen; Biegeräume frei halten.</text>
<text x="660" y="393">Kamera- und Stativaufnahmen aus V3</text>
<text x="660" y="422">unverändert übernommen.</text>
<text x="660" y="486">Unterseitige Taschen und Sacklöcher</text>
<text x="660" y="515">sind in dieser Ansicht nicht sichtbar.</text>
<text x="660" y="579">Keine neuen Schalenbefestigungsbohrungen:</text>
<text x="660" y="608">Positionen bleiben in Issue #10 offen.</text>
<text x="660" y="672">Bezug y=0 bleibt die bisherige Hinterkante</text><text x="660" y="701">der Bodenplatte; neue Hinterkante y=−70.</text></g><text x="35" y="825" font-size="16">Quelle: bodenplatte_hdkatov_V3_1.scad · Montageprobe am realen Aufbau steht aus.</text></g></svg>
